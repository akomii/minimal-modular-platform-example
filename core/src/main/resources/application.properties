spring.application.name=core
spring.config.import=file:docker.properties
modules.dir=modules

# Ring-buffer capacities of the observability streams (backlog replayed to new subscribers)
observability.request-log-capacity=500
observability.server-log-capacity=1000

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dwh}
spring.datasource.username=${DB_USERNAME:dwh}
spring.datasource.password=${DB_PASSWORD:dwh}
spring.flyway.enabled=true
spring.flyway.schemas=core

# OIDC identity provider (BFF login + JWT validation), provider-agnostic: point the IDP_* variables
# at any OIDC-compliant IdP. Dev defaults target the local Keycloak from dev/keycloak/compose.yaml.
spring.security.oauth2.client.provider.idp.issuer-uri=${IDP_ISSUER_URI:http://localhost:8081/realms/modular}
spring.security.oauth2.client.registration.idp.provider=idp
spring.security.oauth2.client.registration.idp.client-id=${IDP_CLIENT_ID:core}
spring.security.oauth2.client.registration.idp.client-secret=${IDP_CLIENT_SECRET:dev-core-secret}
spring.security.oauth2.client.registration.idp.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.idp.scope=openid,profile

spring.security.oauth2.resourceserver.jwt.issuer-uri=${IDP_ISSUER_URI:http://localhost:8081/realms/modular}