spring.application.name=core
server.port=8080
modules.dir=modules
# Module container runtime — selects the ModuleRuntime implementation (currently: docker)
modules.runtime=docker
# Docker daemon connection (used when modules.runtime=docker)
docker.host=unix:///var/run/docker.sock
docker.tlsVerify=false
docker.certPath=
# Database connection details handed to module containers as MODULE_DB_* env vars
# (host.docker.internal resolves to the docker host via host-gateway)
modules.db-host=host.docker.internal
modules.db-port=5432
modules.db-name=dwh
# Ring-buffer capacities of the observability streams (backlog replayed to new subscribers)
observability.request-log-capacity=500
observability.server-log-capacity=1000
# Serve the built SPA (vite dist, copied to classpath:/ui by the frontend build) at the web root,
# so index.html answers "/" and its absolute /assets/* references resolve from classpath:/ui/assets.
spring.web.resources.static-locations=classpath:/ui/
spring.datasource.url=jdbc:postgresql://localhost:5432/dwh
spring.datasource.username=dwh
spring.datasource.password=dwh
spring.flyway.enabled=true
spring.flyway.schemas=core
# Stateless Bearer-token API chain (e.g. Postman sending Authorization: Bearer <jwt>).
# Off by default; the browser/SPA BFF login is the normal path into the platform.
security.api-token.enabled=true
# OIDC identity provider (BFF login + JWT validation), provider-agnostic: point these properties
# at any OIDC-compliant IdP. Values target the local Keycloak from dev/keycloak/compose.yaml.
spring.security.oauth2.client.provider.idp.issuer-uri=http://localhost:8081/realms/modular
spring.security.oauth2.client.registration.idp.provider=idp
spring.security.oauth2.client.registration.idp.client-id=core
spring.security.oauth2.client.registration.idp.client-secret=dev-core-secret
spring.security.oauth2.client.registration.idp.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.idp.scope=openid,profile
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/modular