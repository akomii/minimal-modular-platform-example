spring.application.name=core
spring.config.import=file:docker.properties
module.dir=modules

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dwh}
spring.datasource.username=${DB_USERNAME:dwh}
spring.datasource.password=${DB_PASSWORD:dwh}
spring.flyway.enabled=true
spring.flyway.schemas=core

spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/modular}
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=core
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:dev-core-secret}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/modular}