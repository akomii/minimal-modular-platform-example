# Local development helper ONLY.
# Spins up a throwaway Postgres so you can run the core app on your machine.
# Not used by tests, not a production deployment.
# Usage: docker compose -f dev/db/compose.yaml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dwh
      POSTGRES_USER: dwh
      POSTGRES_PASSWORD: dwh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwh -d dwh"]
      interval: 5s
      timeout: 3s
      retries: 5
