# Read-only connection to the core schema, using the database user the platform
# provisioned for this module (MODULE_DB_* env vars injected at container creation).
apiVersion: 1
datasources:
  - name: Core DWH
    uid: core-dwh
    type: postgres
    access: proxy
    url: ${MODULE_DB_HOST}:${MODULE_DB_PORT}
    user: ${MODULE_DB_USER}
    jsonData:
      database: ${MODULE_DB_NAME}
      sslmode: disable
    secureJsonData:
      password: ${MODULE_DB_PASSWORD}
    isDefault: true
    editable: false
